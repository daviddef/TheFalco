name: Build and deploy the archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm ci || npm install
        working-directory: site
      - name: Build
        run: npm run build
        working-directory: site
        env:
          # The key for data/living-feed.json (keyed hashes of living people's dates and held-out names). Without it the
          # living-feed gate runs its seal check, prints a warning and skips the date/name scan.
          LIVING_FEED_KEY: ${{ secrets.LIVING_FEED_KEY }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
